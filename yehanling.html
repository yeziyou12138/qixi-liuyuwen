</style></head><body><div class="noise"></div><main><div class="bar"><span>绝密档案 / 编号 YHL-001</span><span>状态：待判定</span></div><section class="file"><div class="head"><small>特别行为调查组</small><h1>叶涵灵<br>大傻子行为档案</h1></div><div class="body"><div class="warning">⚠ 警告：以下鉴定过程过于科学，可能引发当事人不服。</div><div class="grid"><div>被调查人</div><div>叶涵灵</div><div>主要特征</div><div>时常说出令人沉默的东西</div><div>危险等级</div><div>看似正常，实际需要观察</div><div>当前结论</div><div id="state">证据收集中……</div></div><div>大傻子指数 <b id="pct">0%</b></div><div class="meter"><span id="fill"></span></div><div class="actions"><button id="investigate">开始严肃调查</button><button class="red" id="appeal">提交复议申请</button></div><div class="verdict" id="verdict"></div><p class="foot">本页面仅供朋友间恶搞；最终解释权归调查组所有。</p></div></section></main><div class="stamp" id="stamp">鉴定为：<br>大 傻 子</div><script>

document.getElementById('appeal').onclick=()=>{v.textContent='【复议结果】申请已被系统自动驳回。驳回理由：系统认为你就是。';v.classList.add('show');stamp.classList.add('show')};
</script></body></html>
